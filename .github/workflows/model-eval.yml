name: Model tests and eval

# Never run contributor PR code on a maintainer's physical Mac.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-eval
  cancel-in-progress: false

jobs:
  model:
    if: github.ref == 'refs/heads/main'
    name: Model tests and eval
    # MLX inference needs Metal. Provision a dedicated runner with this label
    # before dispatching; the same script also runs locally without a runner.
    runs-on: [self-hosted, macOS, ARM64, appears-model]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run real-model tests and eval
        run: mac/scripts/test-model.sh
