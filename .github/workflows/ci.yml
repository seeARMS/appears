name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and MCP
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test core, Messages and MCP
        working-directory: mac/Packages/AppearsKit
        run: swift test
      - name: Test packaging scripts
        run: python3 -I -m unittest discover -s mac/scripts/tests -v

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check, test and build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

  mac:
    name: Mac app
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
      - name: Build and check privacy and notices
        run: mac/scripts/check-app.sh
      - name: Test update signatures and packaging
        run: python3 -I -m unittest discover -s mac/scripts/tests -v
      - name: Explain model coverage
        run: echo 'Model inference tests and eval are separate; see CONTRIBUTING.md.' >> "$GITHUB_STEP_SUMMARY"
