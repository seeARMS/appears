name: Release Mac app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mac-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag before accessing release secrets
        id: tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a stable vX.Y.Z tag." >&2; exit 1; }
          [[ "$WORKFLOW_REF" == "refs/tags/$TAG" ]] || { echo "Run this workflow from the same version tag." >&2; exit 1; }
          [[ "${TAG#v}" == "$(cat VERSION)" ]] || { echo "Tag must match VERSION." >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor HEAD origin/main || { echo "Release commit must be on main." >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    environment: release
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      # Same personal account and bucket as web/wrangler.jsonc.
      CLOUDFLARE_ACCOUNT_ID: 68d615b353a7fe2663d3e7154366864a
      R2_BUCKET: appears-downloads
      DEVELOPER_ID: ${{ vars.DEVELOPER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ vars.NOTARY_ISSUER }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          for setting in DEVELOPER_ID TEAM_ID NOTARY_KEY_ID CERTIFICATE CERTIFICATE_PASSWORD NOTARY_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_KEY; do
            [[ -n "${!setting}" ]] || { echo "Missing release setting: $setting" >&2; exit 1; }
          done

      - name: Read matching GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/appears-release.json"
          printf 'GITHUB_RELEASE_PATH=%s/appears-release.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          brew install xcodegen uv awscli
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Build isolated Sparkle and test release metadata
        run: |
          mac/scripts/build-sparkle.sh
          python3 -I -m unittest discover -s mac/scripts/tests

      - name: Test core
        working-directory: mac/Packages/AppearsKit
        run: swift test

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: model
        with:
          path: mac/Models/appears-model
          key: appears-model-${{ hashFiles('mac/scripts/fetch-model.sh', 'mac/scripts/prepare_model.py', 'mac/ModelNotices/*', 'mac/Packages/AppearsModel/ThirdParty/EmbeddingGemma2Swift/APACHE-2.0.txt', 'mac/Packages/AppearsKit/Sources/AppearsCore/Resources/model-download.json') }}

      - name: Prepare model for separate hosting
        if: steps.model.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mac/scripts/fetch-model.sh

      - name: Verify web and download routes
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Install signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/appears-signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/appears-signing.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/appears-notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/appears-sparkle-key"
          printf 'NOTARY_KEY_PATH=%s/appears-notary.p8\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SPARKLE_PRIVATE_KEY_PATH=%s/appears-sparkle-key\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/appears-signing.p12" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/appears-signing.p12"

      - name: Build signed and notarized DMG
        run: mac/scripts/release.sh "${TAG#v}"

      - name: Upload to R2 and update latest download
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 -I mac/scripts/upload-model.py
          mac/scripts/upload-release.sh "${TAG#v}"
          echo 'Download: https://appea.rs/app.dmg' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/appears-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/appears-signing.p12" "$RUNNER_TEMP/appears-notary.p8" "$RUNNER_TEMP/appears-sparkle-key" "$RUNNER_TEMP/appears-release.json"
