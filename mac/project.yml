# XcodeGen spec for Appears.xcodeproj (generated, not committed): `cd mac && xcodegen`.
#
# Three processes (see README.md, "Privacy, and how each part is enforced"):
# - Appears.app: the menu bar app. Reads the screen through the Accessibility API, which
#   Apple doesn't allow in the App Sandbox, so it isn't sandboxed. It has no networking code;
#   scripts/check-no-network.sh fails if its binary imports any networking API. (It can't
#   sandbox itself either: a self-applied sandbox_init profile, even one that only denies IP
#   networking, makes macOS refuse it Accessibility. Found 2026-10-15.)
# - AppearsEngine.xpc: indexing, the model, search and the journal. App Sandbox with NO
#   network entitlement; read-only access to the home folder and /Volumes. Never add
#   com.apple.security.network.client or network.server to it.
# - AppearsDownloader.xpc: first-run pinned model download, sandboxed with only
#   network.client. No access to user files or screen data.
name: Appears
options:
  bundleIdPrefix: rs.appea
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Signing lives in Config/Base.xcconfig (ad-hoc by default), overridable in the git-ignored
    # Config/Local.xcconfig. Ad-hoc signatures change every build, and macOS forgets
    # Accessibility and Full Disk Access with them.
packages:
  AppearsKit:
    path: Packages/AppearsKit
  AppearsModel:
    path: Packages/AppearsModel
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
targets:
  Appears:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    postBuildScripts:
      - name: Bundle third-party licenses
        basedOnDependencyAnalysis: false
        script: |
          python3 -I "$SRCROOT/scripts/bundle-licenses.py" \
            --build-dir "$BUILD_DIR" \
            --resolved "$PROJECT_FILE_PATH/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" \
            --sparkle "$SRCROOT/build/sparkle-src" \
            --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
    dependencies:
      - package: AppearsKit
        products: [AppearsCore, AppearsContext]
      - package: KeyboardShortcuts
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
      - target: AppearsEngine
        embed: true
        codeSign: true
      - target: AppearsDownloader
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Appears
        PRODUCT_BUNDLE_IDENTIFIER: rs.appea.appears
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Appears
        CFBundleDisplayName: Appears
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # A menu bar app: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: © 2026 Colin Armstrong. MIT License.
        SUFeedURL: https://appea.rs/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUEnableDownloaderService: true
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUSignedFeedFailureExpirationInterval: 0
        NSAppleEventsUsageDescription: Appears asks Safari and Chrome for the current page's address, and Chrome whether the window is private. Nothing leaves this Mac.
        # Reading events needs full access (macOS 14 and later); Appears never writes to the calendar.
        NSCalendarsFullAccessUsageDescription: Appears looks at your next meeting a few minutes before it starts, to bring up related files you already have. It reads events in memory only, never changes them, and nothing leaves this Mac.
        NSContactsUsageDescription: Appears shows contact names and photos instead of phone numbers in Messages results. Contacts are read in memory only, never changed, and nothing leaves this Mac.
    entitlements:
      path: App/Appears.entitlements
      properties:
        # Hardened Runtime needs this to send Apple Events (browser URLs).
        com.apple.security.automation.apple-events: true
        # And this to read Calendar events (looking ahead to meetings), with the user's permission.
        com.apple.security.personal-information.calendars: true
        # Optional Contacts access for presenting Messages results, only in the app.
        com.apple.security.personal-information.addressbook: true
  AppearsEngine:
    type: xpc-service
    platform: macOS
    sources:
      - path: Engine
    dependencies:
      - package: AppearsKit
        product: AppearsCore
      - package: AppearsModel
        product: GemmaEmbedder
    settings:
      base:
        PRODUCT_NAME: AppearsEngine
        PRODUCT_BUNDLE_IDENTIFIER: rs.appea.appears.engine
    info:
      path: Engine/Info.plist
      properties:
        CFBundleName: AppearsEngine
        CFBundleDisplayName: Appears Engine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
          RunLoopType: NSRunLoop
    entitlements:
      path: Engine/AppearsEngine.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Read-only: your home folder (files, and Notes' database in its group container, which
        # also needs Full Disk Access) and external drives for folders you include.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /Volumes/
  # This is the only process allowed to download. No home-folder entitlement,
  # no screen access, and an XPC interface with no data or URL arguments.
  AppearsDownloader:
    type: xpc-service
    platform: macOS
    sources:
      - path: Downloader
    dependencies:
      - package: AppearsKit
        product: AppearsDownloads
    settings:
      base:
        PRODUCT_NAME: AppearsDownloader
        PRODUCT_BUNDLE_IDENTIFIER: rs.appea.appears.downloader
    info:
      path: Downloader/Info.plist
      properties:
        CFBundleName: AppearsDownloader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
          RunLoopType: NSRunLoop
    entitlements:
      path: Downloader/AppearsDownloader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
  # Developer tool: renders the panel and onboarding with demo results to PNGs in
  # build/snapshots (light and dark). Never shipped.
  appears-snapshots:
    type: tool
    platform: macOS
    sources:
      - path: App/Sources
        excludes:
          - AppearsApp.swift
      - path: Tools/Snapshots
    dependencies:
      - package: AppearsKit
        products: [AppearsCore, AppearsContext]
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: appears-snapshots
  # Developer tool: prints what the Accessibility API reads from the frontmost window every
  # few seconds. Never shipped. The terminal running it needs the Accessibility permission.
  appears-context:
    type: tool
    platform: macOS
    sources:
      - path: Tools/ContextProbe
    dependencies:
      - package: AppearsKit
        products: [AppearsCore, AppearsContext]
    settings:
      base:
        PRODUCT_NAME: appears-context
schemes:
  Appears:
    build:
      targets:
        Appears: all
    run:
      config: Debug
    archive:
      config: Release
  appears-context:
    build:
      targets:
        appears-context: all
  appears-snapshots:
    build:
      targets:
        appears-snapshots: all
